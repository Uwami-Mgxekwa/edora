<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EDORA — Dashboard</title>
  <link rel="icon" type="image/png" href="assets/images/logo light mode.png">
  <link rel="apple-touch-icon" href="assets/images/logo light mode.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="EDORA">
  <meta name="theme-color" content="#FFD84D">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>(function(){var t=localStorage.getItem('edora-theme')||'light';document.documentElement.setAttribute('data-theme',t);})();</script>
</head>
<body>

<div class="overlay" id="overlay" onclick="closeSidebar()"></div>

<aside class="sb" id="sb">
  <div class="sb-top">
    <div class="logo">
      <img src="assets/images/logo light mode.png" alt="EDORA" class="logo-img light-logo">
      <img src="assets/images/logo dark mode.png"  alt="EDORA" class="logo-img dark-logo">
    </div>
    <div class="tagline">Your Learning. Your Pace. Your Future.</div>
  </div>
  <nav class="sb-nav" id="sb-nav"></nav>
  <div class="sb-bottom">
    <a href="profile.html" class="sb-user" id="sb-user">
      <div class="av" id="sb-av"></div>
      <div class="sb-user-info">
        <div class="sb-user-name" id="sb-uname"></div>
        <div class="sb-user-grade" id="sb-ugrade"></div>
      </div>
    </a>
    <div class="sb-powered-by">
      <img src="assets/images/uwami-logo.png" alt="Uwami Mgxekwa logo">
      powered by <a href="https://uwamimgxekwa.com" target="_blank" rel="noopener noreferrer">uwami mgxekwa</a>
    </div>
  </div>
</aside>

<div class="main">
  <header class="top">
    <button class="burger" id="burger-btn" aria-label="Open menu" onclick="toggleSidebar()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <span class="top-title" id="top-title"></span>
    <div class="top-actions">
      <button class="theme-btn" id="theme-btn" title="Toggle dark / light mode" onclick="toggleTheme()">
        <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      </button>
      <a href="notifications.html" class="icon-btn" id="notif-btn" title="Notifications" style="text-decoration:none">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span class="notif-badge" id="notif-badge" style="display:none"></span>
      </a>
      <a href="profile.html" class="av" id="top-av" style="text-decoration:none" title="Profile"></a>
    </div>
  </header>
  <main id="view" class="fade-in"></main>
</div>

<div class="modal" id="modal" onclick="handleModalClick(event)">
  <div class="mbox" id="mbox"></div>
</div>

<script src="js/mock-data.js"></script>
<script>
  // Force this page to the dashboard view
  if (!location.hash || location.hash === '#') location.hash = '#dash';
</script>
<script src="js/app.js"></script>
</body>
</html>
